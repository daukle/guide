name: Wiki site

# The site is built from daukle/manifest plus every repository's wiki/, so it is
# rebuilt on a schedule as well as on a push: a plugin that adds a page should
# appear here without anyone touching this repository.
#
# No secrets and no token. Every fetch the build makes is raw.githubusercontent,
# which is not rate limited; the one thing that must list a directory is the
# manifest, which is generated elsewhere with a token.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# A called workflow's permissions are INTERSECTED with the caller's, so these have
# to be granted here even though docs.yml asks for them itself. Omitting them is a
# startup_failure with no log at all, which reads exactly like the secrets mistake
# that preceded it.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: intisy/workflows/.github/workflows/docs.yml@main
    with:
      install: 'echo "no dependencies: that is the point"'
      build: ''
      docs: 'npm run docs'
      site_dir: 'site'
